# 워크플로우의 이름을 'Python CI'로 지정합니다.
# 'CI'는 지속적 통합(Continuous Integration)을 의미합니다.
name: Python CI

# 'main' 브랜치에 'push' 이벤트가 발생할 때 이 워크플로우를 실행합니다.
on:
  push:
    branches: [ "main" ]
  # 'main' 브랜치를 대상으로 하는 'pull_request'가 생성될 때도 실행하면 더욱 좋습니다.
  pull_request:
    branches: [ "main" ]

# 실행될 작업(job) 목록을 정의합니다.
jobs:
  # 'build-and-test'라는 이름의 작업을 정의합니다.
  build-and-test:
    # 이 작업은 최신 버전의 우분투(Ubuntu) 환경에서 실행됩니다.
    runs-on: ubuntu-latest

    # 작업 내에서 순차적으로 실행될 단계(step) 목록입니다.
    steps:
      # 1. 저장소 코드 체크아웃
      # Runner(가상 머신)에 현재 프로젝트의 소스 코드를 가져옵니다.
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Python 환경 설정
      # 프로젝트에서 사용할 Python 버전을 설치하고 설정합니다.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # 프로젝트에 맞는 Python 버전을 지정합니다.

      # 3. 의존성 설치
      # pip을 업그레이드하고, requirements.txt에 명시된 라이브러리들을 설치합니다.
      # 이 단계가 실패하면, 의존성 설정에 문제가 있다는 것을 의미합니다.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # 테스트에 필요한 라이브러리가 별도 파일에 있다면 함께 설치합니다.
          # 예: pip install -r requirements-dev.txt

      # 4. 코드 스타일 검사 (Linting) (POC 단계에서는 제외)
      # flake8과 같은 린터를 사용하여 코드 포맷팅 규칙을 준수하는지 검사합니다.
      # 이 단계는 코드의 가독성과 일관성을 유지하는 데 도움을 줍니다.
      - name: Lint with flake8
        run: |
          # flake8 라이브러리를 설치합니다. (의존성에 추가해두는 것이 더 좋습니다.)
          pip install flake8
          # flake8 실행: --count 옵션은 통계와 함께 결과를 보여줍니다.
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # --exit-zero 옵션은 경고만 있을 경우에도 CI를 통과시키기 위해 사용될 수 있습니다.
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      # 5. 단위 테스트 실행   (POC 단계에서는 제외)
      # pytest를 사용하여 작성된 테스트 코드를 실행합니다.
      # 이 단계는 코드의 기능이 의도대로 정확하게 동작하는지를 검증하는 CI의 핵심입니다.
    #   - name: Test with pytest
    #     run: |
    #       # pytest 라이브러리를 설치합니다. (의존성에 추가해두는 것이 더 좋습니다.)
    #       pip install pytest
    #       # pytest를 실행하여 'tests/' 디렉터리의 모든 테스트를 수행합니다.
    #       pytest

    #CD 부분
      - name: Show build number # 도커 허브에 올릴 빌드 넘버 만들기
        run: |
          echo "Build Number: ${{ github.run_number }}" # 빌드 넘버는 런 넘버 입니다

      - name: Show pull request number # 여기는 pr 인지 확인 해주고 빌드 해줍니다.
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          echo "PR Number: ${{ github.event.pull_request.number }}"

      - name: Get PR Number for Main Branch Merge # pr number 추출
        id: get_pr_number
        if: github.ref == 'refs/heads/main'
        run: |
            PR_NUMBER=$(gh pr list --repo ${{ github.repository }} --state closed --json number,mergeCommit --jq ".[] | select(.mergeCommit.oid == \"${{ github.sha }}\") | .number")
            echo "PR_NUMBER=${PR_NUMBER}"
            echo "PR_NUMBER"="${PR_NUMBER}" >> $GITHUB_OUTPUT
        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Set Docker Image Tag # pr넘버와 run number기반 도커 이미지 태그 만들기
        id: set_docker_image_tag
        env:
            PR_NUMBER: ${{ steps.get_pr_number.outputs.PR_NUMBER }}
        run: |
            if [ "${{ github.ref_name }}" == "main" ]; then # 메인 브렌치로 머지하는 경우
            DOCKER_IMAGE_TAG="1.1.$PR_NUMBER"
            else # 그냥 풀 리퀘 요청인 경우
            DOCKER_IMAGE_TAG="0.${{ github.event.pull_request.number }}.${{ github.run_number }}"
            fi
            echo "Docker Image Tag: $DOCKER_IMAGE_TAG"
            echo "DOCKER_IMAGE_TAG"="${DOCKER_IMAGE_TAG}" >> $GITHUB_OUTPUT
      # 4. Docker Hub 로그인 단계
      - name: Log in to Docker Hub
        # 'docker/login-action@v3' 액션을 사용하여 Docker Hub에 안전하게 로그인합니다.
        uses: docker/login-action@v3
        with:
          # 'username' 파라미터에 Docker Hub 사용자 이름을 전달합니다.
          # 'secrets.DOCKER_USERNAME'은 GitHub 저장소의 'Secrets'에 저장된 'DOCKER_USERNAME' 값을 안전하게 가져옵니다.
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          # 'password' 파라미터에 Docker Hub 비밀번호 또는 액세스 토큰을 전달합니다.
          # 이 또한 'Secrets'에 저장된 'DOCKER_PASSWORD' 값을 안전하게 가져와서 로그에 노출되지 않도록 합니다.
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      # 5. Docker 이미지 빌드 및 푸시 단계
      - name: Build and push Docker image
        run: |
          # 2번 단계에서 설정한 환경 변수($DOCKER_IMAGE_TAG)를 로그에 출력하여 확인합니다.
          echo "Using Docker Image Tag: $DOCKER_IMAGE_TAG"
          # 'docker build' 명령을 사용하여 Docker 이미지를 생성합니다.
          # '-t' 옵션으로 이미지의 이름과 태그를 지정합니다. 형식: <DockerHub아이디>/<이미지이름>:<태그>
          # 마지막의 '.'은 현재 디렉터리에 있는 'Dockerfile'을 사용하여 이미지를 빌드하라는 의미입니다.
          docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/ppikkappeonjjeog:$DOCKER_IMAGE_TAG .
          # 'docker push' 명령을 사용하여 방금 빌드한 이미지를 Docker Hub 저장소로 업로드합니다.
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/ppikkappeonjjeog:$DOCKER_IMAGE_TAG